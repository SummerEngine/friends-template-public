; Export presets of the hosted build. tools/stage_hosted_export.sh regenerates the filters of both presets in its clone
; from the domain graph (tools/build_domain_graph.py); the values here are the static baseline.
[preset.0]

name="summer.games"
platform="summer.games"
runnable=false
dedicated_server=false
custom_features="summer_client"
export_filter="all_resources"
include_filter="*.json,assets/fonts/*-OFL.txt,cast/fonts/*-OFL.txt"
exclude_filter="*_probe.gd,build_scene.gd,*.py,*.md,*.bak,__pycache__/*,lab/*,authority/*,balloon/balloon_lab.*,*/_ref/*"
export_path=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

platforms/ios=true
platforms/android=true
platforms/macos=true
platforms/windows=true

[preset.1]

name="FRIENDS Authority"
platform="Linux"
runnable=false
dedicated_server=true
custom_features="summer_authority"
export_filter="all_resources"
include_filter="world.json,runtime-manifest.json,source-domains.json,assets/authority_resources.json"
exclude_filter="*_probe.gd,build_scene.gd,*.py,*.md,*.bak,__pycache__/*,lab/*,client/*,audio/*,*.png,*.jpg,*.wav,*.ogg,*.glb,*.gltf,assets/prop_kit/*,assets/looks/*"
export_path=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/architecture="x86_64"

[preset.2]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json,assets/fonts/*-OFL.txt,cast/fonts/*-OFL.txt"
exclude_filter="*_probe.gd,build_scene.gd,*.py,*.md,*.bak,__pycache__/*,lab/*,authority/*,balloon/balloon_lab.*,*/_ref/*"
export_path="../build/web/index.html"
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

custom_template/debug=""
custom_template/release=""
variant/runtime_profile="summer-web-jspi-v1"
variant/preparation_mode="disabled"
variant/base_shader_demand=false
variant/defer_specialization=false
shader_baker/enabled=false
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
